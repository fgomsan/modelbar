name: Grok Bots kit

on:
  pull_request:
    paths:
      - "grok-bots/**"
      - ".github/workflows/grok-bots-check.yml"
  push:
    paths:
      - "grok-bots/**"
      - ".github/workflows/grok-bots-check.yml"

jobs:
  roster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate roster
        run: python3 grok-bots/scripts/check_roster.py
